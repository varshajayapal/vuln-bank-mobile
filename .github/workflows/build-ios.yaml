# iOS build of the React Native app, scanned by Appknox (Android is in build.yaml)
name: Appknox iOS Build
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      riskThreshold:
        description: "Risk Threshold"
        required: false
        default: CRITICAL

permissions:
  contents: write
  pull-requests: write

env:
  RISK_THRESHOLD: CRITICAL
  APPKNOX_ACCESS_TOKEN: 12113443ec9b5c141adc459f9afec11830d709d4
  APPKNOX_API_HOST: https://autofix.staging.appknox.io/
  # fastlane needs a UTF-8 locale and shouldn't stop to check for updates
  LC_ALL: en_US.UTF-8
  LANG: en_US.UTF-8
  FASTLANE_SKIP_UPDATE_CHECK: "1"
  FASTLANE_HIDE_CHANGELOG: "1"
  # React Native's iOS project (paths relative to repo root); pod install creates the workspace
  IOS_WORKSPACE: ios/VulnerableBankApp.xcworkspace
  IOS_SCHEME: VulnerableBankApp
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Set risk threshold for push
        if: github.event_name != 'workflow_dispatch'
        run: |
          echo "RISK_THRESHOLD=${{ env.RISK_THRESHOLD }}" >> $GITHUB_ENV
      - name: Set risk threshold for workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "RISK_THRESHOLD=${{ github.event.inputs.riskThreshold }}" >> $GITHUB_ENV
      - name: Show Xcode version
        run: xcodebuild -version
      # Same Node as the Android build (build.yaml)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      # React Native's pods are read from node_modules, so this must run before pod install
      - name: Install npm packages
        run: npm ci
      - name: Set up Ruby and fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      # Unsigned build: enough for Appknox scanning, not for installing on a device.
      # The lane writes the IPA path to APP_PATH.
      - name: Build the app
        timeout-minutes: 60
        run: bundle exec fastlane ios build_unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: vuln-bank-mobile.ipa
          path: ${{ env.APP_PATH }}
          if-no-files-found: error
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Checkout appknox-go
        uses: actions/checkout@v4
        with:
          repository: appknox/appknox-go
          ref: feature/knoxfixer
          path: appknox-go
      - name: Build appknox CLI
        working-directory: appknox-go
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bin"
          go build -o "$GITHUB_WORKSPACE/bin/appknox" .
      - name: Upload app and run Appknox cicheck
        id: appknox_scan
        continue-on-error: true
        run: |
          # The CLI prints some errors to stdout, so show the captured output on failure.
          if ! OUTPUT=$(./bin/appknox upload "$APP_PATH" --knoxiq); then
            echo "$OUTPUT"
            echo "::error::appknox upload failed"
            exit 1
          fi
          FILE_ID=$(printf '%s' "$OUTPUT" | tail -n 1 | tr -d '[:space:]')
          if ! [[ "$FILE_ID" =~ ^[0-9]+$ ]]; then
            echo "$OUTPUT"
            echo "::error::appknox upload did not return a numeric file ID"
            exit 1
          fi
          echo "Uploaded file id: $FILE_ID"
          echo "file_id=$FILE_ID" >> "$GITHUB_OUTPUT"
          ./bin/appknox cicheck "$FILE_ID" --risk-threshold "${RISK_THRESHOLD}"
      - name: Run Appknox autofix
        if: steps.appknox_scan.outputs.file_id != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APPKNOX=./bin/appknox
          FILE_ID="${{ steps.appknox_scan.outputs.file_id }}"
          $APPKNOX autofix --file-id "$FILE_ID"
      - name: Fail if cicheck found issues
        if: steps.appknox_scan.outcome == 'failure'
        run: exit 1
